<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artemis Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #e6f3ff; --dim: #8fb3d9; --cyan: #5fe1ff; --line: rgba(95,225,255,.28);
  --glass: rgba(8,18,40,.55); --red: #ff6b7d; --amber: #ffc46b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #050b1a; color: var(--ink);
  font-family: 'Noto Sans JP', system-ui, sans-serif; }
#bg { position: fixed; inset: 0; background: url(bg.jpg) center / cover no-repeat;
  animation: drift 60s ease-in-out infinite alternate; transform-origin: 60% 40%; }
@keyframes drift { from { transform: scale(1.02); } to { transform: scale(1.07) translate(-1%, .5%); } }
#vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at 35% 45%, transparent 40%, rgba(0,0,0,.55)); pointer-events: none; }

header { position: fixed; top: 22px; left: 32px; right: 32px; display: flex; justify-content: space-between; align-items: baseline; }
#title { font-family: Orbitron, sans-serif; font-weight: 700; letter-spacing: .5em; font-size: 22px; }
#title span { color: var(--cyan); }
#clock { font-family: Orbitron, sans-serif; font-size: 30px; letter-spacing: .08em; text-align: right; }
#clock small { display: block; font-size: 11px; color: var(--dim); letter-spacing: .3em; }

#cube { position: fixed; left: 0; top: 0; width: 58vw; height: 100vh; }
#fallback { position: fixed; left: 29vw; top: 45vh; width: 140px; height: 140px; margin: -70px; perspective: 600px; display: none; }
#fallback .c { position: absolute; inset: 0; transform-style: preserve-3d; animation: spin 14s linear infinite; }
#fallback .c i { position: absolute; inset: 0; border: 2px solid var(--cyan); background: rgba(10,61,102,.45); box-shadow: 0 0 24px rgba(95,225,255,.35) inset; }
#fallback .c i:nth-child(1) { transform: translateZ(70px); } #fallback .c i:nth-child(2) { transform: rotateY(180deg) translateZ(70px); }
#fallback .c i:nth-child(3) { transform: rotateY(90deg) translateZ(70px); } #fallback .c i:nth-child(4) { transform: rotateY(-90deg) translateZ(70px); }
#fallback .c i:nth-child(5) { transform: rotateX(90deg) translateZ(70px); } #fallback .c i:nth-child(6) { transform: rotateX(-90deg) translateZ(70px); }
body.busy #fallback .c { animation-duration: 4s; }
body.nogl #fallback { display: block; } body.nogl #cube { display: none; }
@keyframes spin { from { transform: rotateX(-18deg) rotateY(0); } to { transform: rotateX(-18deg) rotateY(360deg); } }
#status { position: fixed; left: 29vw; top: 72vh; transform: translateX(-50%); text-align: center;
  font-family: Orbitron, sans-serif; letter-spacing: .4em; font-size: 12px; color: var(--dim); }
#status b { display: block; color: var(--ink); font-size: 15px; margin-top: 6px; letter-spacing: .2em; font-family: 'Noto Sans JP'; font-weight: 500; }

#tools { position: fixed; left: 3vw; top: 14vh; width: 22vw; display: flex; flex-direction: column; gap: 8px; }
.tool { background: var(--glass); border: 1px solid var(--line); border-left: 3px solid var(--cyan);
  padding: 8px 12px; border-radius: 4px; backdrop-filter: blur(8px); font-size: 13px;
  animation: slide .35s ease-out; transition: opacity .6s, transform .6s; }
.tool .n { font-family: Orbitron, sans-serif; font-size: 11px; letter-spacing: .2em; color: var(--cyan); }
.tool .a { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool.done { border-left-color: #7dffb0; opacity: 0; transform: translateX(-12px); }
.tool.err { border-left-color: var(--red); }
@keyframes slide { from { opacity: 0; transform: translateX(-16px); } }

#log { position: fixed; right: 32px; top: 96px; bottom: 104px; width: min(40vw, 640px);
  background: var(--glass); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(14px) saturate(1.2);
  display: flex; flex-direction: column; overflow: hidden; }
#log h2 { margin: 0; padding: 12px 18px; font: 500 11px Orbitron, sans-serif; letter-spacing: .4em; color: var(--dim); border-bottom: 1px solid var(--line); }
#msgs { flex: 1; overflow-y: auto; padding: 14px 18px; scroll-behavior: smooth; }
.m { margin: 0 0 16px; line-height: 1.75; font-size: 15px; white-space: pre-wrap; word-break: break-word; animation: fade .4s; }
.m .who { font: 500 10px Orbitron, sans-serif; letter-spacing: .3em; color: var(--cyan); margin-bottom: 3px; }
.m.user .who { color: var(--amber); }
.m.user { color: #fff4e0; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }

form { position: fixed; left: 32px; right: 32px; bottom: 28px; display: flex; gap: 10px; }
#in { flex: 1; background: var(--glass); border: 1px solid var(--line); border-radius: 26px; padding: 14px 22px;
  color: var(--ink); font: 15px 'Noto Sans JP', sans-serif; outline: none; backdrop-filter: blur(10px); }
#in:focus { border-color: var(--cyan); box-shadow: 0 0 18px rgba(95,225,255,.25); }
button { width: 52px; border-radius: 50%; border: 0; background: var(--cyan); color: #04122a; font-size: 20px; cursor: pointer; }
#note { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); display: none;
  background: var(--glass); border: 1px solid var(--red); padding: 14px 20px; border-radius: 8px; }

@media (max-width: 900px) {
  #cube { width: 100vw; height: 40vh; } #status { left: 50vw; top: 32vh; }
  #tools { display: none; } #log { left: 16px; right: 16px; width: auto; top: 42vh; bottom: 88px; }
  header { left: 16px; right: 16px; } form { left: 16px; right: 16px; }
}
</style>
</head>
<body>
<div id="bg"></div><div id="vignette"></div>
<canvas id="cube"></canvas>
<div id="fallback"><div class="c"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<header>
  <div id="title">ARTEMIS <span>CODE</span></div>
  <div id="clock">--:--<small>----.--.--</small></div>
</header>
<div id="tools"></div>
<div id="status">OFFICER<b>待機中</b></div>
<section id="log"><h2>LOG</h2><div id="msgs"></div></section>
<form id="f" autocomplete="off"><input id="in" placeholder="副長へ"><button title="送る">↑</button></form>
<div id="note"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ── the officer: a cube ──────────────────────────────────────────
// Rotates slowly when idle, faster while working, pulses while speaking,
// and flashes red when a tool fails. Replace it with your own face whenever you like.
const canvas = document.getElementById('cube');
let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { document.body.classList.add('nogl'); }   // no WebGL: a CSS cube stands in
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
camera.position.set(0, 0.4, 6.2);

const group = new THREE.Group(); scene.add(group);
const core = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4),
  new THREE.MeshStandardMaterial({ color: 0x0b2a4a, metalness: .6, roughness: .25, emissive: 0x0a3d66, emissiveIntensity: .6, transparent: true, opacity: .85 }));
group.add(core);
const edges = new THREE.LineSegments(new THREE.EdgesGeometry(core.geometry),
  new THREE.LineBasicMaterial({ color: 0x5fe1ff, transparent: true, opacity: .95 }));
group.add(edges);
const shell = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2.1, 2.1, 2.1)),
  new THREE.LineBasicMaterial({ color: 0x5fe1ff, transparent: true, opacity: .18 }));
group.add(shell);
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.9, .008, 8, 160),
  new THREE.MeshBasicMaterial({ color: 0x5fe1ff, transparent: true, opacity: .45 }));
ring.rotation.x = Math.PI / 2.3; scene.add(ring);

const pts = new Float32Array(600 * 3);
for (let i = 0; i < 600; i++) {
  const r = 2.4 + Math.random() * 2.2, t = Math.random() * Math.PI * 2, y = (Math.random() - .5) * 3;
  pts.set([Math.cos(t) * r, y, Math.sin(t) * r], i * 3);
}
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x9fe8ff, size: .025, transparent: true, opacity: .6 }));
scene.add(dust);

scene.add(new THREE.AmbientLight(0x6688cc, .6));
const key = new THREE.PointLight(0x5fe1ff, 30, 20); key.position.set(3, 3, 4); scene.add(key);
const glow = new THREE.PointLight(0x5fe1ff, 0, 6); scene.add(glow);

const S = { busy: false, speakUntil: 0, flash: 0 };
function resize() {
  if (!renderer) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
if (renderer) renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  const speaking = performance.now() < S.speakUntil;
  const spin = S.busy ? 1.1 : .25;
  group.rotation.y += dt * spin; group.rotation.x = Math.sin(t * .4) * .25;
  group.position.y = Math.sin(t * .9) * .08;
  const pulse = speaking ? .5 + .5 * Math.abs(Math.sin(t * 9)) : 0;
  const s = 1 + pulse * .06; core.scale.setScalar(s); edges.scale.setScalar(s);
  shell.rotation.y -= dt * spin * .6; shell.rotation.z += dt * .1;
  ring.rotation.z += dt * (S.busy ? .8 : .2);
  dust.rotation.y += dt * .03;
  S.flash = Math.max(0, S.flash - dt * 1.5);
  const col = new THREE.Color(0x5fe1ff).lerp(new THREE.Color(0xff6b7d), S.flash);
  edges.material.color.copy(col); ring.material.color.copy(col);
  core.material.emissiveIntensity = .5 + pulse * 1.4 + (S.busy ? .3 : 0);
  glow.intensity = pulse * 8 + (S.busy ? 2 : 0);
  renderer.render(scene, camera);
});

// ── the screen ───────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const msgs = $('msgs'), tools = $('tools'), status = $('status').querySelector('b');

setInterval(() => {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  $('clock').firstChild.nodeValue = `${p(d.getHours())}:${p(d.getMinutes())}`;
  $('clock').querySelector('small').textContent = `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
}, 1000);

function addMsg(m) {
  const el = document.createElement('div');
  el.className = 'm ' + m.role;
  el.innerHTML = `<div class="who">${m.role === 'user' ? 'YOU' : 'OFFICER'}</div>`;
  el.appendChild(document.createTextNode(m.text));
  msgs.appendChild(el);
  while (msgs.children.length > 120) msgs.firstChild.remove();
  msgs.scrollTop = msgs.scrollHeight;
  if (m.role === 'assistant') S.speakUntil = Math.max(S.speakUntil, performance.now() + Math.min(4000, 600 + m.text.length * 40));
}
function addTool(t) {
  const el = document.createElement('div');
  el.className = 'tool'; el.id = 'tool-' + t.id;
  el.innerHTML = `<div class="n"></div><div class="a"></div>`;
  el.querySelector('.n').textContent = t.name.toUpperCase();
  el.querySelector('.a').textContent = t.arg || '…';
  tools.appendChild(el);
  while (tools.children.length > 8) tools.firstChild.remove();
  status.textContent = t.name;
}
function toolDone(id, err) {
  const el = document.getElementById('tool-' + id);
  if (err) S.flash = 1;
  if (!el) return;
  el.classList.add(err ? 'err' : 'done');
  setTimeout(() => el.remove(), err ? 6000 : 1200);
}
function setBusy(b) { S.busy = b; document.body.classList.toggle('busy', b); status.textContent = b ? '作業中' : '待機中'; if (!b) tools.innerHTML = ''; }

// voice (optional): the server sends {type:'audio', url, dur}; see docs/VOICE.md
const queue = [], played = new Set(); let playing = false;
function playNext() {
  if (playing || !queue.length) return;
  const a = queue.shift(); playing = true;
  const el = new Audio(a.url);
  el.onplay = () => { S.speakUntil = performance.now() + (a.dur ? a.dur * 1000 : 3000); };
  el.onended = el.onerror = () => { playing = false; playNext(); };
  el.play().catch(() => { playing = false; playNext(); });
}

async function load() {
  const r = await fetch('/api/state').then(r => r.json()).catch(() => null);
  if (!r) return;
  msgs.innerHTML = ''; tools.innerHTML = '';
  r.chat.forEach(addMsg); r.tools.forEach(addTool); setBusy(r.busy);
  S.speakUntil = 0;
}
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/events`);
  ws.onopen = load;
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'chat') addMsg(ev.msg);
    else if (ev.type === 'tool') addTool(ev.tool);
    else if (ev.type === 'tooldone') toolDone(ev.id, ev.err);
    else if (ev.type === 'turn') setBusy(ev.state === 'start');
    else if (ev.type === 'reset') load();
    else if (ev.type === 'audio' && !played.has(ev.url)) { played.add(ev.url); queue.push(ev); playNext(); }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();

$('f').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('in').value.trim(); if (!text) return;
  $('in').value = '';
  const r = await fetch('/api/send', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) }).then(r => r.json()).catch(() => ({ ok: false }));
  if (!r.ok) { const n = $('note'); n.textContent = r.error || '送れませんでした'; n.style.display = 'block'; setTimeout(() => n.style.display = 'none', 4000); }
};
addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== $('in')) { e.preventDefault(); $('in').focus(); } });
</script>
</body>
</html>
